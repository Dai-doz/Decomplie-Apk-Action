name: Decompile APK with Apktool & Upload Artifact

on:
  workflow_dispatch: 
  push:
    paths:
      - '**.apk'  

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Find and Decompile APK
        run: |
          APK_PATH=$(find . -maxdepth 2 -name "*.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "Error: Apk not found in repository!"
            exit 1
          fi
          
          echo "Processing decompile apk: $APK_PATH"
          
          # 'decompiled_apk'
          apktool d "$APK_PATH" -o decompiled_apk -f

      - name: Zip decompiled files
        run: |
          zip -r decompiled_output.zip decompiled_apk

      - name: Upload Zip to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apktool-Decompiled-Source
          path: decompiled_output.zip
          retention-days: 7